<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Rig Tool — tarayıcıda çalışan rigging ve bölge etiketleme aracı">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1a2029" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.78" cy="0.15" r="0.7">
      <stop offset="0%" stop-color="#3b6fd4" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#3b6fd4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heat" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f4fd8"/>
      <stop offset="55%" stop-color="#a13fb0"/>
      <stop offset="100%" stop-color="#ff4d3d"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" rx="18" fill="#0f1115"/>
  <rect width="1200" height="340" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="340" rx="18" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="18" fill="none" stroke="#242b36"/>

  <!-- sol: başlık bloğu -->
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
    <text x="64" y="104" fill="#6f8299" font-size="13" letter-spacing="3.2" font-weight="600">GLB → SKINNED GLB · RIG.JSON · CONTEXT.MD</text>
    <text x="62" y="176" fill="#e9eff8" font-size="66" font-weight="700" letter-spacing="-1.5">Rig Tool</text>
    <text x="64" y="212" fill="#9db0c8" font-size="17">Tarayıcıda çalışan rigging ve bölge etiketleme aracı.</text>
    <text x="64" y="238" fill="#69809a" font-size="16">Nerede ne olduğunu sen gösterirsin; kemiği, ağırlığı ve belgeyi araç üretir.</text>

    <g font-size="12" font-weight="600">
      <rect x="64" y="262" width="76" height="26" rx="13" fill="#16202e" stroke="#27384d"/>
      <text x="102" y="279" fill="#7fb0ff" text-anchor="middle">Three.js</text>
      <rect x="150" y="262" width="56" height="26" rx="13" fill="#16202e" stroke="#27384d"/>
      <text x="178" y="279" fill="#7fb0ff" text-anchor="middle">Vite</text>
      <rect x="216" y="262" width="94" height="26" rx="13" fill="#16202e" stroke="#27384d"/>
      <text x="263" y="279" fill="#7fb0ff" text-anchor="middle">vanilla JS</text>
      <rect x="320" y="262" width="118" height="26" rx="13" fill="#1b1a15" stroke="#403a26"/>
      <text x="379" y="279" fill="#ffc857" text-anchor="middle">bağımlılık yok*</text>
    </g>
  </g>

  <!-- sağ: üç aşama -->
  <!-- 1. ham mesh -->
  <g transform="translate(700,52) scale(1.15)">
    <g fill="#222834" stroke="#3d4757" stroke-width="1.5" stroke-linecap="round">
      <circle cx="75" cy="36" r="23"/>
      <rect x="59" y="54" width="32" height="42" rx="14"/>
      <path d="M91 66 L112 96" fill="none" stroke-width="11"/>
      <path d="M59 66 L38 96" fill="none" stroke-width="11"/>
      <path d="M68 94 L66 128" fill="none" stroke-width="12"/>
      <path d="M82 94 L84 128" fill="none" stroke-width="12"/>
      <ellipse cx="64" cy="131" rx="9" ry="4.5"/>
      <ellipse cx="86" cy="131" rx="9" ry="4.5"/>
    </g>
    <g stroke="#39424f" stroke-width="0.7" opacity="0.85" fill="none">
      <path d="M52 36h46M52 24h46M52 48h46M59 66h32M59 78h32M59 90h32"/>
    </g>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#66788e">
    <text x="786" y="288" text-anchor="middle">ham mesh</text>
  </g>

  <!-- 2. iskelet -->
  <g transform="translate(860,52) scale(1.15)">
    <g fill="#1b212b" stroke="#2e3644" stroke-width="1.5" stroke-linecap="round">
      <circle cx="75" cy="36" r="23"/>
      <rect x="59" y="54" width="32" height="42" rx="14"/>
      <path d="M91 66 L112 96" fill="none" stroke-width="11"/>
      <path d="M59 66 L38 96" fill="none" stroke-width="11"/>
      <path d="M68 94 L66 128" fill="none" stroke-width="12"/>
      <path d="M82 94 L84 128" fill="none" stroke-width="12"/>
    </g>
    <g stroke="#ffc857" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M75 96 L75 78 L75 64 L75 52 L75 38 L75 18"/>
      <path d="M75 64 L91 66 L104 82 L112 95"/>
      <path d="M75 64 L59 66 L46 82 L38 95"/>
      <path d="M75 96 L68 100 L66 116 L65 129"/>
      <path d="M75 96 L82 100 L84 116 L85 129"/>
    </g>
    <g fill="#ffe6a8">
      <circle cx="75" cy="96" r="2.6"/><circle cx="75" cy="78" r="2.2"/><circle cx="75" cy="64" r="2.2"/>
      <circle cx="75" cy="52" r="2.2"/><circle cx="75" cy="38" r="2.2"/>
      <circle cx="91" cy="66" r="2.2"/><circle cx="104" cy="82" r="2.2"/><circle cx="112" cy="95" r="2.6"/>
      <circle cx="59" cy="66" r="2.2"/><circle cx="46" cy="82" r="2.2"/><circle cx="38" cy="95" r="2.6"/>
      <circle cx="66" cy="116" r="2.2"/><circle cx="84" cy="116" r="2.2"/>
      <circle cx="65" cy="129" r="2.6"/><circle cx="85" cy="129" r="2.6"/>
    </g>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#66788e">
    <text x="946" y="288" text-anchor="middle">iskelet</text>
  </g>

  <!-- 3. ağırlık -->
  <g transform="translate(1020,52) scale(1.15)">
    <g stroke="none">
      <circle cx="75" cy="36" r="23" fill="#1f4fd8"/>
      <rect x="59" y="54" width="32" height="42" rx="14" fill="#2b46b8"/>
      <path d="M91 66 L112 96" fill="none" stroke="url(#heat)" stroke-width="11" stroke-linecap="round"/>
      <path d="M59 66 L38 96" fill="none" stroke="url(#heat)" stroke-width="11" stroke-linecap="round"/>
      <path d="M68 94 L66 128" fill="none" stroke="#2f5bd0" stroke-width="12" stroke-linecap="round"/>
      <path d="M82 94 L84 128" fill="none" stroke="#2f5bd0" stroke-width="12" stroke-linecap="round"/>
    </g>
    <g opacity="0.5" stroke="#0f1115" stroke-width="0.6" fill="none">
      <path d="M52 36h46M59 66h32M59 78h32M59 90h32"/>
    </g>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#66788e">
    <text x="1106" y="288" text-anchor="middle">ağırlık + bölge</text>
  </g>

  <!-- oklar -->
  <g stroke="#3c4756" stroke-width="1.5" fill="none">
    <path d="M842 170 h14"/><path d="M851 165 l6 5 -6 5" fill="#3c4756" stroke="none"/>
    <path d="M1002 170 h14"/><path d="M1011 165 l6 5 -6 5" fill="#3c4756" stroke="none"/>
  </g>
</svg>
