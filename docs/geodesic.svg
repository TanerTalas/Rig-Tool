<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 470" width="1160" height="470" role="img" aria-label="Öklid mesafesi ile geodezik mesafenin karşılaştırması">
  <defs>
    <linearGradient id="leak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b46b8"/>
      <stop offset="45%" stop-color="#2b46b8"/>
      <stop offset="72%" stop-color="#8c3f8f"/>
      <stop offset="100%" stop-color="#e2453a"/>
    </linearGradient>
    <linearGradient id="clean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b46b8"/>
      <stop offset="100%" stop-color="#24399b"/>
    </linearGradient>
    <marker id="dot" markerWidth="6" markerHeight="6" refX="3" refY="3">
      <circle cx="3" cy="3" r="2.6" fill="#ffc857"/>
    </marker>
  </defs>

  <rect width="1160" height="470" rx="16" fill="#0f1115" stroke="#242b36"/>

  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
    <text x="40" y="44" fill="#e9eff8" font-size="17" font-weight="600">Mesafe nasıl ölçülüyor?</text>
    <text x="40" y="68" fill="#7f92a9" font-size="13">Ağırlık, vertex'in kemiğe uzaklığına göre dağıtılıyor. Uzaklığın tanımı sonucun tamamını belirliyor.</text>

    <!-- ============ SOL PANEL: ÖKLİD ============ -->
    <g>
      <rect x="40" y="92" width="520" height="336" rx="12" fill="#12161d" stroke="#232a35"/>
      <text x="66" y="126" fill="#ff8b7d" font-size="14" font-weight="700">ÖKLİD — düz çizgi</text>
      <text x="66" y="150" fill="#7f92a9" font-size="12.5">Havada ölçer. Gövdeye yapışık kol, gövdeyi kendine çeker.</text>

      <!-- gövde -->
      <rect x="196" y="176" width="112" height="212" rx="34" fill="url(#leak)"/>
      <!-- kol -->
      <path d="M330 200 L344 340" stroke="#e2453a" stroke-width="34" stroke-linecap="round" fill="none"/>
      <!-- kemik -->
      <path d="M330 200 L337 270 L344 336" stroke="#ffc857" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <circle cx="330" cy="200" r="4" fill="#ffe6a8"/><circle cx="337" cy="270" r="3.4" fill="#ffe6a8"/><circle cx="344" cy="336" r="4" fill="#ffe6a8"/>
      <!-- ölçüm -->
      <path d="M296 320 L332 322" stroke="#ff8b7d" stroke-width="2" stroke-dasharray="5 4"/>
      <text x="252" y="356" fill="#ff8b7d" font-size="12" text-anchor="middle">2 birim</text>
      <path d="M300 336 L316 348" stroke="#4a5766" stroke-width="1"/>
      <text x="352" y="316" fill="#ffc857" font-size="12">el kemiği</text>

      <text x="150" y="212" fill="#9fb4cf" font-size="12" text-anchor="end">gövde</text>
      <path d="M156 208 L192 216" stroke="#3a4756" stroke-width="1"/>

      <rect x="66" y="374" width="468" height="38" rx="8" fill="#1b1216" stroke="#3a2226"/>
      <text x="84" y="398" fill="#ff9d90" font-size="12.5">Sonuç: kalça vertex'leri el kemiğinden ağırlık alır → kol kalkınca gövde de kalkar.</text>
    </g>

    <!-- ============ SAĞ PANEL: GEODEZİK ============ -->
    <g>
      <rect x="600" y="92" width="520" height="336" rx="12" fill="#12161d" stroke="#232a35"/>
      <text x="626" y="126" fill="#7fd6a0" font-size="14" font-weight="700">GEODEZİK — yüzeyde yürüyerek</text>
      <text x="626" y="150" fill="#7f92a9" font-size="12.5">Mesafe, üçgen kenarları boyunca Dijkstra ile ölçülür.</text>

      <rect x="756" y="176" width="112" height="212" rx="34" fill="url(#clean)"/>
      <path d="M890 200 L904 340" stroke="#e2453a" stroke-width="34" stroke-linecap="round" fill="none"/>
      <path d="M890 200 L897 270 L904 336" stroke="#ffc857" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <circle cx="890" cy="200" r="4" fill="#ffe6a8"/><circle cx="897" cy="270" r="3.4" fill="#ffe6a8"/><circle cx="904" cy="336" r="4" fill="#ffe6a8"/>

      <!-- yüzey yolu: elden kol boyunca yukarı, omuzdan gövdeye, gövde boyunca aşağı -->
      <path d="M904 330 C 918 300 912 230 898 194 C 886 172 862 180 856 200 L856 330"
            stroke="#7fd6a0" stroke-width="2.5" fill="none" stroke-dasharray="6 5" stroke-linecap="round"/>
      <circle cx="904" cy="330" r="4" fill="#7fd6a0"/>
      <circle cx="856" cy="330" r="4" fill="#7fd6a0"/>
      <text x="946" y="252" fill="#7fd6a0" font-size="12">26 birim</text>
      <text x="946" y="270" fill="#5d7f6e" font-size="11.5">yüzeyde yürünen yol</text>

      <rect x="626" y="374" width="468" height="38" rx="8" fill="#101c16" stroke="#1f3a2b"/>
      <text x="644" y="398" fill="#8fdcae" font-size="12.5">Sonuç: el uzakta kalır, gövde mavi kalır → kol kalkar, gövde durur.</text>
    </g>

    <text x="40" y="452" fill="#5c6c80" font-size="11.5">İkisi de araçta seçilebilir: naif Öklid referans olarak duruyor, panelde iki yöntemin sızıntı oranı yan yana gösteriliyor.</text>
  </g>
</svg>
